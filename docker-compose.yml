name: miraflores

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB: ${N8N_DB}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      MIRA_APP_PASSWORD: ${MIRA_APP_PASSWORD}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    networks: [internal]

  n8n:
    image: n8nio/n8n:1.123.27
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${PUBLIC_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${PUBLIC_HOST}/
      GENERIC_TIMEZONE: America/Lima
      TZ: America/Lima
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      # Editor: private access only (SSH tunnel). Never published through Caddy.
      - "127.0.0.1:${N8N_EDITOR_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    mem_limit: 512m
    networks: [internal, proxy]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    mem_limit: 32m
    networks: [proxy]

volumes:
  pgdata:
  n8ndata:

networks:
  internal:
    internal: true
  # The shared Caddy container joins this network (done in T7).
  proxy:
    name: mira-proxy
